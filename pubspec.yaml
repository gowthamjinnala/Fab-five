name: women_safety_app
description: A Flutter demo app for women's safety with anomaly detection
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sensors_plus: ^4.0.2
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  audioplayers: ^5.2.1
  record: ^5.0.4
  shared_preferences: ^2.2.2
  http: ^1.1.0
  flutter_animate: ^4.2.0+1
  lottie: ^2.7.0
  flutter_svg: ^2.0.9
  animated_text_kit: ^4.2.2
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
